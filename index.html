<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hangeul Start</title>
  <meta name="description" content="Koreanisch von null an lernen, in vier Stufen.">
  <meta name="theme-color" content="#5b5bf0">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="teen">
  <header class="topbar">
    <button class="icon-btn" id="back-btn" type="button" hidden>‹</button>
    <h1 id="title">Hangeul Start</h1>
    <button class="icon-btn lang" id="lang-btn" type="button"></button>
    <button class="icon-btn" id="settings-btn" type="button">⚙︎</button>
  </header>
  <main id="view" tabindex="-1">
    <!-- Nur sichtbar, wenn die Daten nicht geladen werden können (z. B. per Doppelklick geöffnet). -->
    <div class="boot-error" id="boot-error" hidden>
      <p><strong>Inhalte konnten nicht geladen werden / Content could not be loaded.</strong></p>
      <p>Bitte über start.cmd oder einen lokalen Webserver öffnen (siehe README). Please open via start.cmd or a local web server (see README).</p>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
